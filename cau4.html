<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Công nhân</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        table, th, td {
            border: 1px solid black;
        }
        th, td {
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <h1>Danh sách Công nhân</h1>
    <table>
        <thead>
            <tr>
                <th>STT</th>
                <th>Họ và tên</th>
                <th>Ngày sinh</th>
                <th>Địa chỉ</th>
                <th>Lương</th>
                <th>Chức vụ</th>
            </tr>
        </thead>
        <tbody id="table-body">
        </tbody>
    </table>
    <script>
        class CongNhan {
    constructor(stt, hoTen, ngaySinh, diaChi, luong, chucVu) {
        this.stt = stt;
        this.hoTen = hoTen;
        this.ngaySinh = ngaySinh;
        this.diaChi = diaChi;
        this.luong = luong;
        this.chucVu = chucVu;
    }
}

let danhSachCongNhan = [
    new CongNhan(1, "Nguyễn Văn A", "1990-05-15", "Hà Nội", 15000000, "Công nhân"),
    new CongNhan(2, "Trần Thị B", "1985-11-20", "Quảng Nam", 16000000, "Tổ trưởng"),
    new CongNhan(3, "Lê Văn C", "1992-03-10", "Đà Nẵng", 14000000, "Công nhân"),
    new CongNhan(4, "Phạm Thị D", "1995-07-25", "Hồ Chí Minh", 17000000, "Quản lý")
    ];
    </script>
</body>
</html>
